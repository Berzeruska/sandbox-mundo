<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Protótipo do portão do M3</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 14px system-ui, sans-serif; color: #fff; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud { position: fixed; left: 10px; top: 10px; background: #000a; padding: 6px 10px; border-radius: 8px; pointer-events: none; max-width: 60vw; }
      #version { position: fixed; left: 10px; bottom: 8px; background: #000a; padding: 2px 8px; border-radius: 6px; font-size: 12px; pointer-events: none; }
      #bench { position: fixed; right: 10px; top: 10px; font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: #2b6; color: #fff; }
      #report { position: fixed; inset: 5vh 5vw; background: #111e; padding: 12px; border-radius: 10px; display: none; flex-direction: column; gap: 8px; }
      #report textarea { flex: 1; font: 12px monospace; background: #000; color: #eee; white-space: pre; }
      #report div { display: flex; gap: 8px; }
      #report button { font: inherit; padding: 6px 12px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">Gerando o mundo…</div>
    <div id="version"></div>
    <button id="bench">Medir desempenho</button>
    <div id="report"><textarea id="report-text" readonly></textarea><div><button id="report-copy">Copiar</button><button id="report-close">Fechar</button></div></div>
    <script type="module" src="./mundo.ts"></script>
  </body>
</html>
