name: Site e prévias no GitHub Pages

# O GitHub Pages troca o site inteiro a cada publicação. Por isso cada publicação remonta tudo:
# o main na raiz, a última versão de cada branch marco-* em /previa/<branch>/, e /previa/atual/.
# Assim, nem o deploy do main nem o de uma prévia apagam as outras.
on:
  push:
    branches: [main, 'marco-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Confere o que foi enviado
        run: npm ci && npm run check
      - name: Monta o site
        run: bash scripts/build-site.sh site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
